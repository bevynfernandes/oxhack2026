site_name: oxhack2026
repo_url: https://github.com/bevynfernandes/oxhack2026
site_url: https://bevynfernandes.github.io/oxhack2026
site_description: This is a template repository for Python projects that use uv for their dependency management.
site_author: Bevyn Fernandes, Ivan Topchu, Daniyal Rai
edit_uri: edit/main/docs/
repo_name: bevynfernandes/oxhack2026
copyright: Maintained by <a href="https://bevynfernandes.com">bevynfernandes</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["oxhack2026"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bevynfernandes/oxhack2026
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/oxhack2026

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
