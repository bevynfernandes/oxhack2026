[project]
name = "oxhack2026"
version = "0.0.1"
description = "SignalShift project scaffold for developer-tool scouting."
authors = [{ name = "Bevyn Fernandes, Ivan Topchu, Daniyal Rai" }]
readme = "README.md"
keywords = ["forecasting", "developer-tools", "signalshift"]
requires-python = ">=3.12,<3.13"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/bevynfernandes/oxhack2026"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
data = [
    "httpx>=0.28,<1",
    "orjson>=3,<4",
    "polars>=1,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2,<3",
]
storage = [
    "alembic>=1,<2",
    "boto3>=1,<2",
    "psycopg[binary]>=3,<4",
    "sqlalchemy>=2,<3",
]
models = ["catboost>=1.2,<2", "numpy>=2,<3", "scikit-learn>=1.6,<2"]
bigquery = ["google-cloud-bigquery>=3,<4"]
explanations = [
    "google-genai>=1,<2",
    "python-dotenv>=1,<2",
    "websockets>=14,<16",
]
cli = ["typer>=0.16,<1"]
research = [
    "babel>=2.17,<3",
    "beautifulsoup4>=4.13,<5",
    "lxml>=6,<7",
    "playwright>=1.55,<2",
    "trafilatura>=2.0,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff==0.17.2",
    "tox-uv>=1.33.4",
]
docs = ["mkdocs>=1.6.1", "mkdocs-material>=9.7.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oxhack2026"]
exclude = ["*:Zone.Identifier"]

[tool.mypy]
files = ["oxhack2026", "tests"]
exclude = ["^tests/outputs/"]
python_version = "3.12"
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["outputs"]
addopts = "-ra -m 'not integration'"
markers = ["integration: checks requiring explicit local service setup"]

[tool.ruff]
target-version = "py312"
line-length = 88
fix = false
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "YTT", "S", "B", "A", "C4", "T10", "SIM", "I", "C90",
    "E", "W", "F", "PGH", "UP", "RUF", "TRY",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["oxhack2026"]
