name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev --extra api --extra data
      - name: Verify lightweight API composition imports
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import importlib.util
          from oxhack2026.api.company_runtime import create_company_app
          from oxhack2026.api.app import create_app
          from oxhack2026.api.company_repository import PublishedCompanyRepository
          from oxhack2026.storage.company_assessments import SourceScopedAssessmentReader
          assert callable(create_company_app)
          assert create_app().title == "SignalShift"
          assert all(importlib.util.find_spec(name) is None for name in ("numpy", "sklearn", "catboost"))
          PY

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --group docs
      - run: uv run --frozen --no-sync playwright install --with-deps chromium
      - run: make check test build docs-test
      - run: uv run --frozen --no-sync pytest tests/integration/api/test_research_v2_persistence.py -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project .. --locked --extra api --extra data
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SIGNALSHIFT_TEST_RUN: ci-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/outputs/
          retention-days: 14
