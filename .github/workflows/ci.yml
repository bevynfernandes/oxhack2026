name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --group docs
      - run: make check test build docs-test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project .. --locked --extra api --extra data
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SIGNALSHIFT_TEST_RUN: ci-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/outputs/
          retention-days: 14
