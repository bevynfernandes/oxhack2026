name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: api-runtime
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --no-dev --extra api --extra data
      - name: Verify lightweight API composition imports
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import importlib.util
          from oxhack2026.api.company_runtime import create_company_app
          from oxhack2026.api.app import create_app
          from oxhack2026.api.company_repository import PublishedCompanyRepository
          from oxhack2026.storage.company_assessments import SourceScopedAssessmentReader
          assert callable(create_company_app)
          assert create_app().title == "SignalShift"
          assert all(importlib.util.find_spec(name) is None for name in ("numpy", "sklearn", "catboost"))
          PY

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: python
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-extras --group docs
      - run: uv run --frozen --no-sync playwright install --with-deps chromium
      - run: make check test build docs-test
      - run: uv run --frozen --no-sync pytest tests/integration/api/test_research_v2_persistence.py -m integration

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-fund
      - run: npm run format:check
      - run: npm run build
      - run: npm run test

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-fund
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: browser
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --project .. --locked --no-dev --extra api --extra data
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:e2e -- --fully-parallel --workers=1 --shard=${{ matrix.shard }}/2
        env:
          SIGNALSHIFT_TEST_RUN: ci-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: tests/outputs/ci-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}/
          retention-days: 14

  frontend:
    if: ${{ !cancelled() }}
    needs: [frontend-checks, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require frontend checks and browser tests
        env:
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success
